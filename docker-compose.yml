services:
  mysql:
    image: mysql:8.0
    container_name: mysql_container
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - theme-park-net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - theme-park-net

  # ---------- BACKEND SERVICES ----------
  user-service:
    build: ./backend/services/user-service
    container_name: user-service
    restart: unless-stopped
    env_file: ./backend/services/user-service/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - theme-park-net

  ticket-service:
    build: ./backend/services/ticket-service
    container_name: ticket-service
    restart: unless-stopped
    env_file: ./backend/services/ticket-service/.env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - theme-park-net

  revenue-service:
    build: ./backend/services/revenue-service
    container_name: revenue-service
    restart: unless-stopped
    env_file: ./backend/services/revenue-service/.env
    depends_on:
      ticket-service:
        condition: service_healthy
    networks:
      - theme-park-net

  promotion-service:
    build: ./backend/services/promotion-service
    container_name: promotion-service
    restart: unless-stopped
    env_file: ./backend/services/promotion-service/.env
    depends_on:
      mysql:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
    networks:
      - theme-park-net

  game-service:
    build: ./backend/services/game-service
    container_name: game-service
    restart: unless-stopped
    env_file: ./backend/services/game-service/.env
    depends_on:
      mysql:
        condition: service_healthy
      user-service:
        condition: service_healthy
    volumes:
      - gateway_uploads:/app/uploads
    networks:
      - theme-park-net

  event-service:
    build: ./backend/services/event-service
    container_name: event-service
    restart: unless-stopped
    env_file: ./backend/services/event-service/.env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - gateway_uploads:/app/uploads
    networks:
      - theme-park-net

  # ---------- API GATEWAY ----------
  api-gateway:
    build: ./backend/api-gateway
    container_name: api-gateway
    restart: unless-stopped
    env_file: ./backend/api-gateway/.env
    volumes:
      - gateway_uploads:/app/uploads
    depends_on:
      user-service:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
      game-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      promotion-service:
        condition: service_healthy
      revenue-service:
        condition: service_healthy
    ports:
      - "8000:8000"
    expose:
      - "8000"
    networks:
      - theme-park-net

  # ---------- FRONTEND ----------
  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - theme-park-net

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - theme-park-net

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - theme-park-net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus-alerts.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - node-exporter
      - cadvisor
    networks:
      - theme-park-net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    networks:
      - theme-park-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - theme-park-net

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "3007:3000"
    depends_on:
      - loki
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - theme-park-net

networks:
  theme-park-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  gateway_uploads:
  loki_data:
  prometheus_data:
  grafana_data:
