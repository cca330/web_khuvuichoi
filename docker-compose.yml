services:
  mysql:
    image: mysql:8.0
    container_name: mysql_container
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - theme-park-net

  # ---------- BACKEND SERVICES ----------
  user-service:
    build: ./backend/services/user-service
    container_name: user-service
    restart: unless-stopped
    env_file: ./backend/services/user-service/.env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - theme-park-net

  ticket-service:
    build: ./backend/services/ticket-service
    container_name: ticket-service
    restart: unless-stopped
    env_file: ./backend/services/ticket-service/.env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - theme-park-net

  revenue-service:
    build: ./backend/services/revenue-service
    container_name: revenue-service
    restart: unless-stopped
    env_file: ./backend/services/revenue-service/.env
    depends_on:
      ticket-service:
        condition: service_healthy
    networks:
      - theme-park-net

  promotion-service:
    build: ./backend/services/promotion-service
    container_name: promotion-service
    restart: unless-stopped
    env_file: ./backend/services/promotion-service/.env
    depends_on:
      mysql:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
    networks:
      - theme-park-net

  game-service:
    build: ./backend/services/game-service
    container_name: game-service
    restart: unless-stopped
    env_file: ./backend/services/game-service/.env
    depends_on:
      mysql:
        condition: service_healthy
      user-service:
        condition: service_healthy
    volumes:
      - gateway_uploads:/app/uploads
    networks:
      - theme-park-net

  event-service:
    build: ./backend/services/event-service
    container_name: event-service
    restart: unless-stopped
    env_file: ./backend/services/event-service/.env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - gateway_uploads:/app/uploads
    networks:
      - theme-park-net

  # ---------- API GATEWAY ----------
  api-gateway:
    build: ./backend/api-gateway
    container_name: api-gateway
    restart: unless-stopped
    env_file: ./backend/api-gateway/.env
    volumes:
      - gateway_uploads:/app/uploads
    depends_on:
      user-service:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
      game-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      promotion-service:
        condition: service_healthy
      revenue-service:
        condition: service_healthy
    ports:
      - "8000:8000"
    expose:
      - "8000"
    networks:
      - theme-park-net

  # ---------- FRONTEND ----------
  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - theme-park-net

networks:
  theme-park-net:
    driver: bridge

volumes:
  mysql_data:
  gateway_uploads:
