services:
  # Database - Chỉ internal, không expose ra ngoài
  mysql:
    image: mysql:8.0
    container_name: mysql_container
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dbweb}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password}
    # Không expose port ra ngoài - chỉ internal network
    # ports:
    #   - "3306:3306"  # Comment out nếu không cần truy cập từ host
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # User Service
  user-service:
    build: ./services/user-service
    container_name: user_service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-app_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app_password}
      DB_DATABASE: ${MYSQL_DATABASE:-dbweb}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRES_IN: 15m
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-network
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Ticket Service
  ticket-service:
    build: ./services/ticket-service
    container_name: ticket_service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-app_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app_password}
      DB_DATABASE: ${MYSQL_DATABASE:-dbweb}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRES_IN: 15m
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Event Service
  event-service:
    build: ./services/event-service
    container_name: event_service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-app_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app_password}
      DB_DATABASE: ${MYSQL_DATABASE:-dbweb}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRES_IN: 15m
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Game Service
  game-service:
    build: ./services/game-service
    container_name: game_service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-app_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app_password}
      DB_DATABASE: ${MYSQL_DATABASE:-dbweb}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRES_IN: 15m
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Promotion Service
  promotion-service:
    build: ./services/promotion-service
    container_name: promotion_service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-app_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app_password}
      DB_DATABASE: ${MYSQL_DATABASE:-dbweb}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRES_IN: 15m
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Revenue Service
  revenue-service:
    build: ./services/revenue-service
    container_name: revenue_service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-app_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app_password}
      DB_DATABASE: ${MYSQL_DATABASE:-dbweb}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # API Gateway
  api-gateway:
    build: ./api-gateway
    container_name: api_gateway
    restart: unless-stopped
    ports:
      - "3000:3000"  # Chỉ expose API Gateway
    environment:
      NODE_ENV: production
    depends_on:
      - user-service
      - ticket-service
      - event-service
      - game-service
      - promotion-service
      - revenue-service
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  mysql_data:

networks:
  backend-network:
    driver: bridge
