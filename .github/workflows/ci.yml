name: Docker Build CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create .env files
        run: |
          test -n "${{ secrets.MYSQL_ROOT_PASSWORD }}" || { echo "Missing MYSQL_ROOT_PASSWORD secret"; exit 1; }
          test -n "${{ secrets.JWT_SECRET }}" || { echo "Missing JWT_SECRET secret"; exit 1; }
          test -n "${{ secrets.INTERNAL_SERVICE_TOKEN }}" || { echo "Missing INTERNAL_SERVICE_TOKEN secret"; exit 1; }
          printf "MYSQL_ROOT_PASSWORD=%s\n" "${{ secrets.MYSQL_ROOT_PASSWORD }}" > .env
          echo "${{ secrets.USER_SERVICE_ENV }}" > backend/services/user-service/.env
          printf "REDIS_URL=redis://redis:6379\n" >> backend/services/user-service/.env
          echo "${{ secrets.TICKET_SERVICE_ENV }}" > backend/services/ticket-service/.env
          printf "\nDB_HOST=mysql\nDB_PORT=3306\nDB_DATABASE=ticket_db\nDB_USERNAME=ticket_app\nDB_PASSWORD=ticket-password-change-me\nPROMOTION_SERVICE_URL=http://promotion-service:3004\n" >> backend/services/ticket-service/.env
          echo "${{ secrets.PROMOTION_SERVICE_ENV }}" > backend/services/promotion-service/.env
          echo "${{ secrets.GAME_SERVICE_ENV }}" > backend/services/game-service/.env
          echo "${{ secrets.EVENT_SERVICE_ENV }}" > backend/services/event-service/.env
          echo "${{ secrets.REVENUE_SERVICE_ENV }}" > backend/services/revenue-service/.env
          echo "${{ secrets.API_GATEWAY_ENV }}" > backend/api-gateway/.env
          for file in backend/services/*-service/.env; do
            printf "\nJWT_SECRET=%s\nINTERNAL_SERVICE_TOKEN=%s\n" \
              "${{ secrets.JWT_SECRET }}" "${{ secrets.INTERNAL_SERVICE_TOKEN }}" >> "$file"
          done
          printf "\nJWT_SECRET=%s\n" "${{ secrets.JWT_SECRET }}" >> backend/api-gateway/.env

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker Images
        run: docker compose build --no-cache

      - name: Start Containers
        run: |
          docker compose up -d || {
            docker compose ps -a
            docker compose logs --tail=200 ticket-service user-service mysql
            exit 1
          }

      - name: Show Running Containers
        run: docker ps -a

      - name: Wait for API Gateway to be ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8000 > /dev/null; then
              echo "API Gateway is up!"
              exit 0
            fi
            echo "Waiting for API Gateway... ($i/30)"
            sleep 5
          done
          echo "API Gateway did not become ready in time"
          docker compose logs
          exit 1

      - name: Check Frontend Health
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:80 > /dev/null; then
              echo "Frontend is up!"
              exit 0
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
          echo "Frontend did not become ready in time"
          docker compose logs frontend
          exit 1

      - name: Stop Containers
        if: always()
        run: docker compose down
