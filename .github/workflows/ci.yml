name: Docker Build CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create .env files
        run: |
          echo "${{ secrets.USER_SERVICE_ENV }}" > backend/services/user-service/.env
          echo "${{ secrets.TICKET_SERVICE_ENV }}" > backend/services/ticket-service/.env
          echo "${{ secrets.PROMOTION_SERVICE_ENV }}" > backend/services/promotion-service/.env
          echo "${{ secrets.GAME_SERVICE_ENV }}" > backend/services/game-service/.env
          echo "${{ secrets.EVENT_SERVICE_ENV }}" > backend/services/event-service/.env
          echo "${{ secrets.REVENUE_SERVICE_ENV }}" > backend/services/revenue-service/.env
          echo "${{ secrets.API_GATEWAY_ENV }}" > backend/api-gateway/.env

      - name: Show project
        run: ls -la

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker Images
        run: docker compose build

      - name: Start Containers
        run: docker compose up -d

      - name: Wait for services to be ready
        run: sleep 20

      - name: Show Running Containers
        run: docker ps -a

      - name: Check API Gateway Health
        run: curl -f http://localhost:8000 || exit 1

      - name: Check Frontend Health
        run: curl -f http://localhost:80 || exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Containers
        if: always()
        run: docker compose down
