name: Deploy

on:
  workflow_run:
    workflows:
      - "Docker Build CI"
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Go to project
        run: |
          cd /home/user1/Doan
          pwd

      - name: Update source
        run: |
          cd /home/user1/Doan
          git fetch origin
          git reset --hard origin/main

      - name: Create .env files
        run: |
          cd /home/user1/Doan

          echo "${{ secrets.USER_SERVICE_ENV }}" > backend/services/user-service/.env
          echo "${{ secrets.TICKET_SERVICE_ENV }}" > backend/services/ticket-service/.env
          echo "${{ secrets.PROMOTION_SERVICE_ENV }}" > backend/services/promotion-service/.env
          echo "${{ secrets.GAME_SERVICE_ENV }}" > backend/services/game-service/.env
          echo "${{ secrets.EVENT_SERVICE_ENV }}" > backend/services/event-service/.env
          echo "${{ secrets.REVENUE_SERVICE_ENV }}" > backend/services/revenue-service/.env
          echo "${{ secrets.API_GATEWAY_ENV }}" > backend/api-gateway/.env

      - name: Verify .env files
        run: |
          ls -la /home/user1/Doan/backend/services/revenue-service
          ls -la /home/user1/Doan/backend/api-gateway

      - name: Build and start Docker
        run: |
          cd /home/user1/Doan
          docker compose up -d --build

      - name: Wait for services to be ready
        run: sleep 20

      - name: Show running containers
        run: |
          docker ps

      - name: Health Check - Frontend
        run: |
          curl -f http://localhost:80 || (docker compose logs frontend && exit 1)

      - name: Health Check - API Gateway
        run: |
          curl -f http://localhost:8000 || (docker compose logs api-gateway && exit 1)

      - name: Check MySQL
        run: |
          docker exec mysql_container mysqladmin ping -h localhost -p123456

      - name: Show logs if deploy failed
        if: failure()
        run: |
          cd /home/user1/Doan
          docker compose ps
          docker compose logs --tail=100

      - name: Deploy Finished
        run: |
          echo "=================================="
          echo " Deploy Success "
          echo "=================================="
