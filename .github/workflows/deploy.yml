name: Deploy

on:
  workflow_run:
    workflows:
      - "Docker Build CI"
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Go to project
        run: |
          cd /home/user1/Doan
          pwd

      - name: Update source
        run: |
          cd /home/user1/Doan
          git fetch origin
          git reset --hard origin/main

      - name: Build and start Docker
        run: |
          cd /home/user1/Doan
          docker compose up -d --build

      - name: Wait for services to be ready
        run: sleep 20

      - name: Show running containers
        run: |
          docker ps

      - name: Health Check - Frontend
        run: |
          curl -f http://localhost:80 || exit 1

      - name: Health Check - API Gateway
        run: |
          curl -f http://localhost:8000 || exit 1

      - name: Check MySQL
        run: |
          docker exec mysql_container mysqladmin ping -h localhost -p123456

      - name: Deploy Finished
        run: |
          echo "=================================="
          echo " Deploy Success "
          echo "=================================="
