name: Deploy

on:
  workflow_run:
    workflows:
      - "Docker Build CI"
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: self-hosted

    steps:
      # ============================
      # Update source code
      # ============================

      - name: Update source
        run: |
          cd /home/user1/Doan

          echo "Updating source..."

          git checkout main
          git fetch origin
          git reset --hard origin/main

          echo "Current commit:"
          git log -1

      # ============================
      # Create environment files
      # ============================

      - name: Create .env files
        run: |
          cd /home/user1/Doan

          printf "MYSQL_ROOT_PASSWORD=%s\n" "${{ secrets.MYSQL_ROOT_PASSWORD }}" > .env

          printf "%s" "${{ secrets.USER_SERVICE_ENV }}" \
          > backend/services/user-service/.env
          printf "\nREDIS_URL=redis://redis:6379\n" \
          >> backend/services/user-service/.env


          printf "%s" "${{ secrets.TICKET_SERVICE_ENV }}" \
          > backend/services/ticket-service/.env


          printf "%s" "${{ secrets.PROMOTION_SERVICE_ENV }}" \
          > backend/services/promotion-service/.env


          printf "%s" "${{ secrets.GAME_SERVICE_ENV }}" \
          > backend/services/game-service/.env


          printf "%s" "${{ secrets.EVENT_SERVICE_ENV }}" \
          > backend/services/event-service/.env


          printf "%s" "${{ secrets.REVENUE_SERVICE_ENV }}" \
          > backend/services/revenue-service/.env


          printf "%s" "${{ secrets.API_GATEWAY_ENV }}" \
          > backend/api-gateway/.env

          for file in backend/services/*-service/.env
          do
            printf "\nJWT_SECRET=%s\nINTERNAL_SERVICE_TOKEN=%s\n" \
              "${{ secrets.JWT_SECRET }}" "${{ secrets.INTERNAL_SERVICE_TOKEN }}" >> "$file"
          done
          printf "\nJWT_SECRET=%s\n" "${{ secrets.JWT_SECRET }}" >> backend/api-gateway/.env


          echo ".env files created"

      # ============================
      # Verify env
      # ============================

      - name: Verify .env files
        run: |

          echo "Checking files..."

          ls -la /home/user1/Doan/backend/services/user-service
          ls -la /home/user1/Doan/backend/services/revenue-service
          ls -la /home/user1/Doan/backend/api-gateway

      # ============================
      # Stop old containers
      # ============================

      - name: Stop old containers
        run: |
          cd /home/user1/Doan

          docker compose down || true

      # ============================
      # Build Docker images
      # ============================

      - name: Build Docker images
        run: |

          cd /home/user1/Doan


          echo "Building images..."


          docker compose build --pull

      # ============================
      # Start containers
      # ============================

      - name: Start Docker services
        run: |

          cd /home/user1/Doan


          docker compose up -d

      # ============================
      # Wait services
      # ============================

      - name: Wait for services
        run: |

          echo "Waiting services..."


          for i in {1..12}
          do

            if curl -f http://localhost:8000
            then

              echo "API Gateway is ready"
              exit 0

            fi


            echo "Waiting API Gateway..."

            sleep 5

          done


          echo "API Gateway failed"

          docker compose ps

          docker compose logs --tail=100

          exit 1

      # ============================
      # Container status
      # ============================

      - name: Show containers
        run: |

          docker ps

      # ============================
      # Frontend health check
      # ============================

      - name: Health Check Frontend
        run: |
          for i in {1..30}
          do
            if curl -fsS http://127.0.0.1:80 > /dev/null
            then
              echo "Frontend is ready"
              exit 0
            fi

            echo "Waiting frontend... ($i/30)"
            sleep 2
          done

          echo "Frontend failed"
          cd /home/user1/Doan
          docker compose logs frontend
          exit 1

      # ============================
      # API Gateway health check
      # ============================

      - name: Health Check API Gateway
        run: |

          curl -f http://localhost:8000 \
          || (

          cd /home/user1/Doan

          docker compose logs api-gateway

          exit 1

          )

      # ============================
      # MySQL check
      # ============================

      - name: Check MySQL
        run: |

          docker exec mysql_container \
          mysqladmin ping \
          -h localhost \
          -p123456

      # ============================
      # Show logs if failed
      # ============================

      - name: Show logs if deploy failed
        if: failure()

        run: |

          cd /home/user1/Doan


          echo "===== Docker Status ====="

          docker compose ps


          echo "===== Logs ====="

          docker compose logs --tail=200

      # ============================
      # Cleanup
      # ============================

      - name: Docker cleanup
        if: success()

        run: |

          docker image prune -f

      # ============================
      # Finish

      - name: Deploy Finished
        run: |

          echo "=================================="

          echo " Deploy Success "

          echo "=================================="
