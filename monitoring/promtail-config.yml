server:
#cấu hình cho HTTP server của Promtail.
  http_listen_port: 9080
#lưu vị trí mà Promtail đã đọc đến trong file log.  
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: docker
  #cấu hình các target cố định.
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
